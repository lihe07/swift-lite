name: Build rs-worker

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            bin: rs-worker
            output: rs-worker-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bin: rs-worker.exe
            output: rs-worker-windows-x86_64.exe
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rs-worker

      - name: Build
        run: cargo build --release --manifest-path rs-worker/Cargo.toml --target ${{ matrix.target }}

      - name: Stage binary
        shell: bash
        run: cp "rs-worker/target/${{ matrix.target }}/release/${{ matrix.bin }}" "${{ matrix.output }}"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.output }}
          path: ${{ matrix.output }}

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
